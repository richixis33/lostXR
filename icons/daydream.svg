<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- One gradient in user space, so the overlapping petals read as a single shape. -->
    <linearGradient id="petal" gradientUnits="userSpaceOnUse" x1="-250" y1="-215" x2="250" y2="245">
      <stop offset="0" stop-color="#16e6a0"/>
      <stop offset=".38" stop-color="#15d6c4"/>
      <stop offset=".68" stop-color="#1e8bf0"/>
      <stop offset="1" stop-color="#1f5cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1a3a" flood-opacity=".18"/>
    </filter>
  </defs>
    <g filter="url(#soft)" fill="url(#petal)">
    <g transform="translate(300 300) rotate(-12)">
      <circle cx="0" cy="0" r="175"/>
      <circle cx="0" cy="-160" r="140"/>
      <circle cx="139" cy="-80" r="140"/>
      <circle cx="139" cy="80" r="140"/>
      <circle cx="0" cy="160" r="140"/>
      <circle cx="-139" cy="80" r="140"/>
      <circle cx="-139" cy="-80" r="140"/>
    </g>
  </g>
</svg>
